# 在项目根目录执行：docker compose up --build
# Compose 会自动读取同目录下的 .env 用于变量替换（不要把 .env 提交到 Git）

services:
  shiny:
    build: .
    ports:
      - "${HOST_PORT:-3838}:3838"
    environment:
      PORT: "3838"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TV_WEBHOOK_SECRET: ${TV_WEBHOOK_SECRET:-}
      APPV2_DB_PATH: ${APPV2_DB_PATH:-}
      APPV2_WEBHOOK_PORT: ${APPV2_WEBHOOK_PORT:-8000}
